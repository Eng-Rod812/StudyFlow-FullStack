# Entorno local completo: PostgreSQL + aplicación.  Uso: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studyflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/studyflow
      JWT_SECRET: cambia-esto-por-un-secreto-largo-y-aleatorio-de-32-o-mas
      ADMIN_EMAIL: admin@example.com
volumes:
  pgdata:
